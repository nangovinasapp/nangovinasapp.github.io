<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Slider</title>
  <style>
    :root {
      --switch-bottom: 22px;
      --switch-left: 22px;
      --track-duration: 460ms;
      --track-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: #0f1419;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0f1419;
    }

    .track {
      width: 200vw;
      height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      transform: translateX(0);
      transition: transform var(--track-duration) var(--track-ease);
      will-change: transform;
    }

    .track.show-vn {
      transform: translateX(-100vw);
    }

    .pdf-pane {
      width: 100vw;
      height: 100dvh;
      min-height: -webkit-fill-available;
      border: 0;
      background: #e8edf2;
      flex: 0 0 100vw;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 14px 0;
    }

    .pdf-viewer {
      width: 100%;
      display: grid;
      gap: 14px;
      justify-items: center;
      padding: 0 12px 20px;
    }

    .pdf-page {
      width: min(100%, 980px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(17, 24, 34, 0.18);
      overflow: hidden;
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }

    .pdf-status,
    .pdf-error {
      width: min(100%, 980px);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
    }

    .pdf-status {
      color: #395164;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(57, 81, 100, 0.25);
    }

    .pdf-error {
      color: #7a1a1a;
      background: #ffe7e7;
      border: 1px solid #f0b5b5;
    }

    .bottom-control {
      position: fixed;
      left: var(--switch-left);
      bottom: var(--switch-bottom);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #24313d;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 74px;
      height: 34px;
      display: inline-flex;
      align-items: center;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: rgba(24, 96, 104, 0.2);
      border: 1px solid rgba(24, 96, 104, 0.3);
      transition: background 180ms ease;
    }

    .slider::before {
      content: "EN";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #155f68;
      font-size: 0.63rem;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
      transition: transform 180ms ease;
    }

    .switch input:checked + .slider {
      background: rgba(24, 96, 104, 0.36);
    }

    .switch input:checked + .slider::before {
      content: "VN";
      transform: translateX(40px);
    }

    @media (max-width: 720px) {
      :root {
        --switch-bottom: 14px;
        --switch-left: 14px;
      }

      html,
      body,
      .viewport {
        overflow-x: hidden;
      }

      /* Mobile: show one PDF at a time (more reliable than horizontal slide) */
      .track {
        width: 100%;
        max-width: 100%;
        transform: none !important;
        overflow-x: hidden;
      }

      .pdf-pane {
        display: none;
        width: 100%;
        max-width: 100%;
        flex: 0 0 100%;
        touch-action: pan-y;
        padding-top: 10px;
      }

      .pdf-pane.active {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div id="pdf-track" class="track">
      <section
        id="pane-en"
        class="pdf-pane"
        aria-label="English CV"
      >
        <div id="viewer-en" class="pdf-viewer"></div>
      </section>

      <section
        id="pane-vn"
        class="pdf-pane"
        aria-label="Vietnamese CV"
      >
        <div id="viewer-vn" class="pdf-viewer"></div>
      </section>
    </div>
  </div>

  <div class="bottom-control">
    <span class="label">Language</span>
    <label class="switch" for="language-toggle" aria-label="Switch CV language">
      <input id="language-toggle" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const toggle = document.getElementById('language-toggle');
    const track = document.getElementById('pdf-track');
    const paneEn = document.getElementById('pane-en');
    const paneVn = document.getElementById('pane-vn');
    const viewerEn = document.getElementById('viewer-en');
    const viewerVn = document.getElementById('viewer-vn');
    const mobileMq = window.matchMedia('(max-width: 720px)');

    const pdfStates = {
      en: { url: 'en.pdf', container: viewerEn, doc: null, renderToken: 0, lastWidth: 0 },
      vn: { url: 'vn.pdf', container: viewerVn, doc: null, renderToken: 0, lastWidth: 0 }
    };

    function statusNode(message, className) {
      const div = document.createElement('div');
      div.className = className;
      div.textContent = message;
      return div;
    }

    async function getPdfDocument(state) {
      if (!state.doc) {
        state.doc = await pdfjsLib.getDocument(state.url).promise;
      }
      return state.doc;
    }

    async function renderPdf(state) {
      const renderToken = ++state.renderToken;
      state.container.innerHTML = '';
      state.container.appendChild(statusNode('Loading PDF...', 'pdf-status'));

      try {
        const pdfDoc = await getPdfDocument(state);
        if (renderToken !== state.renderToken) return;

        const containerWidth = Math.max(
          320,
          Math.floor(state.container.clientWidth || state.container.parentElement.clientWidth || window.innerWidth)
        );
        const maxPageWidth = Math.min(980, containerWidth - 24);

        state.container.innerHTML = '';

        for (let pageNumber = 1; pageNumber <= pdfDoc.numPages; pageNumber += 1) {
          const page = await pdfDoc.getPage(pageNumber);
          if (renderToken !== state.renderToken) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const cssScale = maxPageWidth / baseViewport.width;
          const viewport = page.getViewport({ scale: cssScale });
          const pixelRatio = window.devicePixelRatio || 1;

          const pageWrap = document.createElement('div');
          pageWrap.className = 'pdf-page';

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d', { alpha: false });

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          canvas.style.width = `${Math.floor(viewport.width)}px`;
          canvas.style.height = `${Math.floor(viewport.height)}px`;

          pageWrap.appendChild(canvas);
          state.container.appendChild(pageWrap);

          const renderContext = {
            canvasContext: ctx,
            viewport,
            transform: pixelRatio !== 1 ? [pixelRatio, 0, 0, pixelRatio, 0, 0] : null
          };

          await page.render(renderContext).promise;
          if (renderToken !== state.renderToken) return;
        }
      } catch (error) {
        state.container.innerHTML = '';
        state.container.appendChild(statusNode('Unable to load PDF. Please refresh the page.', 'pdf-error'));
        console.error(`Failed to render ${state.url}:`, error);
      }
    }

    async function ensureRendered(langKey, force = false) {
      const state = pdfStates[langKey];
      const width = Math.max(
        320,
        Math.floor(state.container.clientWidth || state.container.parentElement.clientWidth || window.innerWidth)
      );

      if (!force && state.lastWidth && Math.abs(state.lastWidth - width) < 8) return;

      state.lastWidth = width;
      await renderPdf(state);
    }

    async function renderVisiblePdfs(force = false) {
      if (mobileMq.matches) {
        await ensureRendered(toggle.checked ? 'vn' : 'en', force);
      } else {
        await Promise.all([
          ensureRendered('en', force),
          ensureRendered('vn', force)
        ]);
      }
    }

    function updateTrackPosition() {
      if (mobileMq.matches) {
        paneEn.classList.toggle('active', !toggle.checked);
        paneVn.classList.toggle('active', toggle.checked);
      } else {
        paneEn.classList.remove('active');
        paneVn.classList.remove('active');
        track.classList.toggle('show-vn', toggle.checked);
      }
    }

    toggle.addEventListener('change', async () => {
      updateTrackPosition();
      await renderVisiblePdfs();
    });

    const onViewportModeChange = async () => {
      updateTrackPosition();
      await renderVisiblePdfs(true);
    };

    if (mobileMq.addEventListener) {
      mobileMq.addEventListener('change', onViewportModeChange);
    } else {
      mobileMq.addListener(onViewportModeChange);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        renderVisiblePdfs(true);
      }, 180);
    });

    updateTrackPosition();
    renderVisiblePdfs(true);
  </script>
</body>
</html>
