<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Slider</title>
  <style>
    :root {
      --switch-bottom: 22px;
      --switch-left: 22px;
      --track-duration: 460ms;
      --track-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background: #0f1419;
    }

    .viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0f1419;
    }

    .track {
      width: 200vw;
      height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      transform: translateX(0);
      transition: transform var(--track-duration) var(--track-ease);
      will-change: transform;
    }

    .track.show-vn {
      transform: translateX(-100vw);
    }

    .pdf-pane {
      width: 100vw;
      height: 100dvh;
      min-height: -webkit-fill-available;
      border: 0;
      background: #fff;
      flex: 0 0 100vw;
    }

    .bottom-control {
      position: fixed;
      left: var(--switch-left);
      bottom: var(--switch-bottom);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(0, 0, 0, 0.14);
      border-radius: 999px;
      backdrop-filter: blur(12px);
    }

    .label {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #24313d;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 74px;
      height: 34px;
      display: inline-flex;
      align-items: center;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: rgba(24, 96, 104, 0.2);
      border: 1px solid rgba(24, 96, 104, 0.3);
      transition: background 180ms ease;
    }

    .slider::before {
      content: "EN";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #155f68;
      font-size: 0.63rem;
      font-weight: 800;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.2);
      transition: transform 180ms ease;
    }

    .switch input:checked + .slider {
      background: rgba(24, 96, 104, 0.36);
    }

    .switch input:checked + .slider::before {
      content: "VN";
      transform: translateX(40px);
    }

    @media (max-width: 720px) {
      :root {
        --switch-bottom: 14px;
        --switch-left: 14px;
      }

      html,
      body,
      .viewport {
        overflow-x: hidden;
      }

      /* Mobile: show one PDF at a time (more reliable than horizontal slide) */
      .track {
        width: 100%;
        max-width: 100%;
        transform: none !important;
        overflow-x: hidden;
      }

      .pdf-pane {
        display: none;
        width: 100%;
        max-width: 100%;
        flex: 0 0 100%;
        touch-action: pan-y;
      }

      .pdf-pane.active {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div id="pdf-track" class="track">
      <iframe
        id="frame-en"
        class="pdf-pane"
        title="English CV"
        src="en.pdf"
      ></iframe>

      <iframe
        id="frame-vn"
        class="pdf-pane"
        title="Vietnamese CV"
        src="vn.pdf"
      ></iframe>
    </div>
  </div>

  <div class="bottom-control">
    <span class="label">Language</span>
    <label class="switch" for="language-toggle" aria-label="Switch CV language">
      <input id="language-toggle" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <script>
    const toggle = document.getElementById('language-toggle');
    const track = document.getElementById('pdf-track');
    const frameEn = document.getElementById('frame-en');
    const frameVn = document.getElementById('frame-vn');
    const mobileMq = window.matchMedia('(max-width: 720px)');

    function setPdfSources() {
      const hash = mobileMq.matches
        ? '#toolbar=0&navpanes=0&scrollbar=1&view=FitH&zoom=page-width'
        : '#toolbar=1&navpanes=0&scrollbar=1&zoom=125';

      const enSrc = `en.pdf${hash}`;
      const vnSrc = `vn.pdf${hash}`;

      if (frameEn.getAttribute('src') !== enSrc) frameEn.setAttribute('src', enSrc);
      if (frameVn.getAttribute('src') !== vnSrc) frameVn.setAttribute('src', vnSrc);
    }

    function updateTrackPosition() {
      if (mobileMq.matches) {
        frameEn.classList.toggle('active', !toggle.checked);
        frameVn.classList.toggle('active', toggle.checked);
      } else {
        frameEn.classList.remove('active');
        frameVn.classList.remove('active');
        track.classList.toggle('show-vn', toggle.checked);
      }
    }

    toggle.addEventListener('change', updateTrackPosition);

    const onViewportModeChange = () => {
      setPdfSources();
      updateTrackPosition();
    };

    if (mobileMq.addEventListener) {
      mobileMq.addEventListener('change', onViewportModeChange);
    } else {
      mobileMq.addListener(onViewportModeChange);
    }

    setPdfSources();
    updateTrackPosition();
  </script>
</body>
</html>
